<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pay Guard demo store</title>
    <style>
      body { font: 1.125rem/1.5 system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; }
      label { display: block; margin: 0.75rem 0; }
      input, textarea { display: block; width: 100%; box-sizing: border-box; font: inherit; padding: 0.5rem; margin-top: 0.25rem; }
      button { font: inherit; min-height: 44px; padding: 0.5rem 1rem; margin-top: 0.5rem; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      label.choice { display: flex; gap: 0.5rem; align-items: baseline; }
      label.choice input { display: inline; width: auto; }
      fieldset { margin: 1rem 0; }
      .warning { border-left: 4px solid #a51d2d; padding-left: 0.75rem; font-weight: 600; }
      .simulation { border-left: 4px solid #865e3c; padding-left: 0.75rem; }
      blockquote { margin: 0.5rem 0; padding-left: 0.75rem; border-left: 3px solid #77767b; }
      .receipt-details dt { font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
